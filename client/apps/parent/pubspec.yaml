publish_to: "none"
version: 0.7.0+7

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  familyguard_core:
    path: ../../packages/core
  shared_preferences: ^2.2.3
  fl_chart: ^1.3.0
