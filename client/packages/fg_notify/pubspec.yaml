name: fg_notify
description: FamilyGuard parent-app notifications (Android, NotificationCompat). No Firebase needed.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.familyguard.fg_notify
        pluginClass: FgNotifyPlugin
