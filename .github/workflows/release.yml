name: Release

# Pushing a version tag (vX.Y.Z) builds both apps (child + parent) for Android
# and Windows, and publishes a GitHub Release with all artifacts attached.
#
# Android install fix (v0.7.1, kept in the v0.9.0 merge): the android/
# folders are committed, so every build uses the same applicationId,
# minSdk/targetSdk and manifest. Release APKs are signed with ONE stable
# keystore supplied via GitHub Secrets — see docs/SIGNING.md. If the
# secrets are missing the Android job FAILS loudly instead of silently
# publishing another debug-signed APK that Android refuses to install
# ("App not installed"). The child app is built twice (lite without
# SMS/contacts/call-log, full with them) and all APKs are re-signed
# with apksigner as a second pass (see "Sign APKs").
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check release signing secrets are set
        run: |
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!s}" ]; then echo "::error::Missing GitHub secret $s — see docs/SIGNING.md"; exit 1; fi
          done
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build CHILD apks (lite + full)
        working-directory: client/apps/child
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Signing config for the committed android/ folder (see docs/SIGNING.md).
          # The keystore + key.properties exist only in this runner, never in git.
          # No `flutter create` here: the android/ folders are committed (v0.7.1
          # install fix) and regenerating them would wipe the signing config.
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/familyguard-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=familyguard-release.keystore
          EOF
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          # LITE: no SMS / contacts / call-log access (much less likely to be
          # blocked by Play Protect). FULL: includes them.
          M=android/app/src/main/AndroidManifest.xml
          python3 ../../../.github/scripts/android_manifest.py "$M" child-lite
          flutter build apk --release --dart-define=FG_LITE=true
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/child-lite.apk"
          python3 ../../../.github/scripts/android_manifest.py "$M" child-full
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/child-full.apk"

      - name: Build PARENT apk
        working-directory: client/apps/parent
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Same committed-android/ signing setup as the child build; no
          # `flutter create` (see above).
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/familyguard-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=familyguard-release.keystore
          EOF
          python3 ../../../.github/scripts/android_manifest.py android/app/src/main/AndroidManifest.xml parent
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/parent.apk"

      - name: Sign APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          S=.github/scripts/sign_apk.sh
          bash $S "$RUNNER_TEMP/child-lite.apk" familyguard-child-lite-${{ github.ref_name }}.apk
          bash $S "$RUNNER_TEMP/child-full.apk" familyguard-child-full-${{ github.ref_name }}.apk
          bash $S "$RUNNER_TEMP/parent.apk" familyguard-parent-${{ github.ref_name }}.apk

      - name: Verify APK identities
        run: |
          for apk in familyguard-child-lite-${{ github.ref_name }}.apk familyguard-child-full-${{ github.ref_name }}.apk familyguard-parent-${{ github.ref_name }}.apk; do
            echo "== $apk"
            AAPT=$(find "${ANDROID_SDK_ROOT:-$HOME/Android/sdk}" -name aapt2 -type f 2>/dev/null | head -1) || true
            if [ -n "$AAPT" ]; then "$AAPT" dump badging "$apk" | grep -E "package: name|application-label" || true; fi
          done
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Publish APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            familyguard-child-lite-${{ github.ref_name }}.apk
            familyguard-child-full-${{ github.ref_name }}.apk
            familyguard-parent-${{ github.ref_name }}.apk
          generate_release_notes: true

  windows:
    name: Build Windows EXEs
    runs-on: windows-latest
    # The whole release is gated on the Android job: if signing secrets are
    # missing (or an APK build fails), no release is created at all — the
    # Windows job must not publish a Windows-only release from a failed run.
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The windows/ folders are committed (v0.7.1), same as android/ — the
      # builds below use them directly and never regenerate them.
      - name: Build CHILD windows
        working-directory: client/apps/child
        run: |
          flutter pub get
          flutter build windows --release
      - name: Zip CHILD
        shell: pwsh
        run: Compress-Archive -Path client/apps/child/build/windows/x64/runner/Release/* -DestinationPath familyguard-child-${{ github.ref_name }}-windows.zip

      - name: Build PARENT windows
        working-directory: client/apps/parent
        run: |
          flutter pub get
          flutter build windows --release
      - name: Zip PARENT
        shell: pwsh
        run: Compress-Archive -Path client/apps/parent/build/windows/x64/runner/Release/* -DestinationPath familyguard-parent-${{ github.ref_name }}-windows.zip

      - name: Publish EXEs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            familyguard-child-${{ github.ref_name }}-windows.zip
            familyguard-parent-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
