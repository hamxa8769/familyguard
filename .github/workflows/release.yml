name: Release

# Pushing a version tag (vX.Y.Z) builds both apps (child + parent) for Android
# and Windows, and publishes a GitHub Release with all artifacts attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build CHILD apk
        working-directory: client/apps/child
        run: |
          flutter create --org com.familyguard --project-name familyguard_child --platforms=android .
          # Child app reads usage stats, contacts and SMS — add the permissions.
          M=android/app/src/main/AndroidManifest.xml
          PERMS='<uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />\n    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.READ_SMS" />\n    <uses-permission android:name="android.permission.READ_CALL_LOG" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    '
          grep -q READ_MEDIA_IMAGES "$M" || sed -i "s#<application#${PERMS}<application#" "$M"
          flutter pub get
          flutter build apk --release
      - run: cp client/apps/child/build/app/outputs/flutter-apk/app-release.apk familyguard-child-${{ github.ref_name }}.apk

      - name: Build PARENT apk
        working-directory: client/apps/parent
        run: |
          flutter create --org com.familyguard --project-name familyguard_parent --platforms=android .
          flutter pub get
          flutter build apk --release
      - run: cp client/apps/parent/build/app/outputs/flutter-apk/app-release.apk familyguard-parent-${{ github.ref_name }}.apk

      - name: Publish APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            familyguard-child-${{ github.ref_name }}.apk
            familyguard-parent-${{ github.ref_name }}.apk
          generate_release_notes: true

  windows:
    name: Build Windows EXEs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build CHILD windows
        working-directory: client/apps/child
        run: |
          flutter create --org com.familyguard --project-name familyguard_child --platforms=windows .
          flutter pub get
          flutter build windows --release
      - name: Zip CHILD
        shell: pwsh
        run: Compress-Archive -Path client/apps/child/build/windows/x64/runner/Release/* -DestinationPath familyguard-child-${{ github.ref_name }}-windows.zip

      - name: Build PARENT windows
        working-directory: client/apps/parent
        run: |
          flutter create --org com.familyguard --project-name familyguard_parent --platforms=windows .
          flutter pub get
          flutter build windows --release
      - name: Zip PARENT
        shell: pwsh
        run: Compress-Archive -Path client/apps/parent/build/windows/x64/runner/Release/* -DestinationPath familyguard-parent-${{ github.ref_name }}-windows.zip

      - name: Publish EXEs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            familyguard-child-${{ github.ref_name }}-windows.zip
            familyguard-parent-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
