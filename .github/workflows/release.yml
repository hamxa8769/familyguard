name: Release

# Pushing a version tag (vX.Y.Z) builds both apps (child + parent) for Android
# and Windows, and publishes a GitHub Release with all artifacts attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build CHILD apks (lite + full)
        working-directory: client/apps/child
        run: |
          flutter create --org com.familyguard --project-name familyguard_child --platforms=android .
          M=android/app/src/main/AndroidManifest.xml
          flutter pub get
          # LITE: no SMS / contacts / call-log access (much less likely to be
          # blocked by Play Protect). FULL: includes them.
          python3 ../../../.github/scripts/android_manifest.py "$M" child-lite
          flutter build apk --release --dart-define=FG_LITE=true
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/child-lite.apk"
          python3 ../../../.github/scripts/android_manifest.py "$M" child-full
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/child-full.apk"

      - name: Build PARENT apk
        working-directory: client/apps/parent
        run: |
          flutter create --org com.familyguard --project-name familyguard_parent --platforms=android .
          python3 ../../../.github/scripts/android_manifest.py android/app/src/main/AndroidManifest.xml parent
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/parent.apk"

      - name: Sign APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          S=.github/scripts/sign_apk.sh
          bash $S "$RUNNER_TEMP/child-lite.apk" familyguard-child-lite-${{ github.ref_name }}.apk
          bash $S "$RUNNER_TEMP/child-full.apk" familyguard-child-full-${{ github.ref_name }}.apk
          bash $S "$RUNNER_TEMP/parent.apk" familyguard-parent-${{ github.ref_name }}.apk

      - name: Publish APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            familyguard-child-lite-${{ github.ref_name }}.apk
            familyguard-child-full-${{ github.ref_name }}.apk
            familyguard-parent-${{ github.ref_name }}.apk
          generate_release_notes: true

  windows:
    name: Build Windows EXEs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build CHILD windows
        working-directory: client/apps/child
        run: |
          flutter create --org com.familyguard --project-name familyguard_child --platforms=windows .
          flutter pub get
          flutter build windows --release
      - name: Zip CHILD
        shell: pwsh
        run: Compress-Archive -Path client/apps/child/build/windows/x64/runner/Release/* -DestinationPath familyguard-child-${{ github.ref_name }}-windows.zip

      - name: Build PARENT windows
        working-directory: client/apps/parent
        run: |
          flutter create --org com.familyguard --project-name familyguard_parent --platforms=windows .
          flutter pub get
          flutter build windows --release
      - name: Zip PARENT
        shell: pwsh
        run: Compress-Archive -Path client/apps/parent/build/windows/x64/runner/Release/* -DestinationPath familyguard-parent-${{ github.ref_name }}-windows.zip

      - name: Publish EXEs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            familyguard-child-${{ github.ref_name }}-windows.zip
            familyguard-parent-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
