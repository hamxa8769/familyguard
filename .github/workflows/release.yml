name: Release

# Pushing a version tag (vX.Y.Z) builds both apps (child + parent) for Android
# and Windows, and publishes a GitHub Release with all artifacts attached.
#
# Android install fix (v0.7.1): the android/ folders are committed, so every
# build uses the same applicationId, minSdk/targetSdk and manifest. Release
# APKs are signed with ONE stable keystore supplied via GitHub Secrets —
# see docs/SIGNING.md. If the secrets are missing the Android job FAILS
# loudly instead of silently publishing another debug-signed APK that
# Android refuses to install ("App not installed").
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check release signing secrets are set
        run: |
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!s}" ]; then echo "::error::Missing GitHub secret $s — see docs/SIGNING.md"; exit 1; fi
          done
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build CHILD apk
        working-directory: client/apps/child
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Signing config for the committed android/ folder (see docs/SIGNING.md).
          # The keystore + key.properties exist only in this runner, never in git.
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/familyguard-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=familyguard-release.keystore
          EOF
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          # Universal APK (not --split-per-abi) so one file installs on any
          # device when sideloaded.
          flutter build apk --release
      - run: cp client/apps/child/build/app/outputs/flutter-apk/app-release.apk familyguard-child-${{ github.ref_name }}.apk

      - name: Build PARENT apk
        working-directory: client/apps/parent
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/familyguard-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=familyguard-release.keystore
          EOF
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release
      - run: cp client/apps/parent/build/app/outputs/flutter-apk/app-release.apk familyguard-parent-${{ github.ref_name }}.apk

      - name: Verify APK identities
        run: |
          for apk in familyguard-child-${{ github.ref_name }}.apk familyguard-parent-${{ github.ref_name }}.apk; do
            echo "== $apk"
            AAPT=$(find "${ANDROID_SDK_ROOT:-$HOME/Android/sdk}" -name aapt2 -type f 2>/dev/null | head -1) || true
            if [ -n "$AAPT" ]; then "$AAPT" dump badging "$apk" | grep -E "package: name|application-label" || true; fi
          done
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Publish APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            familyguard-child-${{ github.ref_name }}.apk
            familyguard-parent-${{ github.ref_name }}.apk
          generate_release_notes: true

  windows:
    name: Build Windows EXEs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # TODO (same class of bug as Android had): the windows/ folders are not
      # committed either, so these builds also regenerate them every run.
      # Commit them the same way if Windows installs ever misbehave.
      - name: Build CHILD windows
        working-directory: client/apps/child
        run: |
          flutter create --org com.familyguard --project-name familyguard_child --platforms=windows .
          flutter pub get
          flutter build windows --release
      - name: Zip CHILD
        shell: pwsh
        run: Compress-Archive -Path client/apps/child/build/windows/x64/runner/Release/* -DestinationPath familyguard-child-${{ github.ref_name }}-windows.zip

      - name: Build PARENT windows
        working-directory: client/apps/parent
        run: |
          flutter create --org com.familyguard --project-name familyguard_parent --platforms=windows .
          flutter pub get
          flutter build windows --release
      - name: Zip PARENT
        shell: pwsh
        run: Compress-Archive -Path client/apps/parent/build/windows/x64/runner/Release/* -DestinationPath familyguard-parent-${{ github.ref_name }}-windows.zip

      - name: Publish EXEs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            familyguard-child-${{ github.ref_name }}-windows.zip
            familyguard-parent-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
