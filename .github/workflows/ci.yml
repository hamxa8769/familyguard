name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Flutter analyze (core + apps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze shared core
        working-directory: client/packages/core
        run: flutter pub get && flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Analyze child app
        working-directory: client/apps/child
        run: flutter pub get && flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Analyze parent app
        working-directory: client/apps/parent
        run: flutter pub get && flutter analyze --no-fatal-infos --no-fatal-warnings

  backend-check:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Syntax check all modules
        working-directory: backend
        run: find src -name "*.js" -print0 | xargs -0 -n1 node --check && echo "All backend JS OK"
      - name: API and persistence tests
        working-directory: backend
        run: npm test
